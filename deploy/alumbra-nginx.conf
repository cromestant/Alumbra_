# Alumbra: nginx site template for alumbra.onthe1.app. Merge into the
# server block certbot manages (keep its ssl_certificate lines), or copy
# to /etc/nginx/sites-available/alumbra and fill in the cert paths.
#
# Static site (repo site/, copied to /var/www/alumbra by
# deploy-update.sh) at /, the APK at /download/alumbra.apk, and every
# other path proxied to the API on 127.0.0.1:${ALUMBRA_PORT} (8125 on
# the VPS). A path that is a file in /var/www/alumbra is served; anything
# else (/ask, /followup, /v1/*, /health, /volunteer) goes to the API.

server {
    listen 443 ssl;
    server_name alumbra.onthe1.app;
    # ssl_certificate     /etc/letsencrypt/live/alumbra.onthe1.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/alumbra.onthe1.app/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/alumbra;
    index index.html;

    # A photo plus a clip: the largest captured clips are ~10.6 MB.
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ @api;
    }

    location /download/ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The volunteer console accepts its token as ?token=, so these stay
    # out of the access log.
    location ~ ^/(volunteer|v1/escalations) {
        access_log off;
        proxy_pass http://127.0.0.1:8125;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    location @api {
        proxy_pass http://127.0.0.1:8125;
        include /etc/nginx/proxy_params;
        # The app waits up to 180 s for an answer; slow asks have taken
        # 82-145 s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
